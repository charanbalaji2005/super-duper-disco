version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: synthetic-expression-generator-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./backend/uploads:/app/backend/uploads
      - ./backend/outputs:/app/backend/outputs
      - ./backend/logs:/app/backend/logs
      - ./backend/database:/app/backend/database
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: synthetic-expression-generator-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
